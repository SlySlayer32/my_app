name: my_app
description: My new Flutter app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # Core Flutter
  bloc: ^8.1.4
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Firebase
  firebase_core: ^2.25.4
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.4
  firebase_storage: ^11.6.5

  # Camera & Image Processing
  camera: ^0.10.5+5
  image: ^4.1.3
  photo_view: ^0.14.0
  image_picker: ^1.0.4

  # Storage
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2

  # UI Components
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9

  # Utilities
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  path: ^1.8.3
  uuid: ^4.2.1

  # Routing
  go_router: ^15.1.2

  # DI
  get_it: ^8.0.3

  # Networking
  http: ^1.2.1

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true
